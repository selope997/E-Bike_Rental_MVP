name: Deploy Supabase

# Deploys Edge Functions and database migrations when anything under supabase/
# changes on main. The frontend is deployed separately by Vercel's Git integration.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'

jobs:
  deploy:
    name: Deploy functions & migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy create-checkout-session
          supabase functions deploy create-booking-session
          supabase functions deploy create-portal-session
          # Stripe calls this endpoint without a Supabase JWT, so JWT verification
          # must be disabled — it is secured by Stripe signature verification instead.
          supabase functions deploy stripe-webhook --no-verify-jwt

      - name: Push database migrations
        run: supabase db push
